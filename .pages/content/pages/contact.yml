name: contact
label: Contact
type: file
format: json
path: src/data/content/pages/contact.json
fields:
  - name: title
    type: string
    label: Titre de la page
    required: true
  - name: description
    label: Description
    type: text
    required: true
  - name: links
    label: Points de contact
    type: object
    list: true
    fields:
      - name: id
        component: uuid
      - name: icon
        label: Icônne
        required: true
        type: image
        options:
          media: icons
      - name: link
        label: Lien
        component: link
