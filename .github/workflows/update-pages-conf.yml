# -------------------------------------------------
# | On each push on dev, we update the .pages.yml |
# | according to the .pages folder.               |
# -------------------------------------------------

name: Update .pages.yml

on:
  push:
    branches:
      - dev

env:
  GIT_EMAIL: "github-actions[bot]@users.noreply.github.com"
  GIT_NAME: "github-actions-pages-updater"

jobs:
  builder:
    name: Builder
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      - name: Build cms' config
        run: .pages/build.sh .pages.yml
      - name: Verify if differences exist
        id: diff
        run: |
          # To disable the exit-early behavior
          set +e

          git add .pages.yml
          git diff --exit-code HEAD .pages.yml
          echo "exists=$?" >> $GITHUB_OUTPUT

          exit 0

      - name: Upload the new version of .pages.cms
        if: steps.diff.outputs.exists == 1
        uses: EndBug/add-and-commit@v10
        with:
          message: "feat: Updating .pages.yml"
          add: .pages.yml
          push: true
          committer_email: ${{ env.GIT_EMAIL }}
          committer_name: ${{ env.GIT_NAME }}
