# -------------------------------------------------
# | Trigger a deploy from current state of the    |
# | 'main' branch.                                |
# |                                               |
# | This is useful because I can trigger deploy   |
# | only when I finished edition on PagesCMS      |
# -------------------------------------------------

name: Deploy & publish main

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-slim
    steps:
      - name: Validate PagesCMS payload
        if: inputs.payload
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: |
          if [ ! "$(printenv PAYLOAD | jq -r .source)" = "pages-cms" ]; then
            echo "::error::The PagesCMS payload is not correct."
            exit 1
          fi

          payload_get() {
            printenv PAYLOAD | jq -r $1
          }

          TRIGGERED_BY=$(payload_get .triggeredBy.name)
          TRIGGERED_AT=$(payload_get .triggeredAt)

          echo "EXTRA_CONTEXT=${EXTRA_CONTEXT}(through PagesCMS by $TRIGGERED_BY at $TRIGGERED_AT)" >> $GITHUB_ENV
          echo "::notice::Deploy triggered via PagesCMS by $TRIGGERED_BY at $TRIGGERED_AT"

      - name: Install required tools
        run: |
          # Installing bun
          curl -fsSL https://bun.com/install | bash

          # Updating path env to correctly find the bun executable
          source ~/.bash_profile
          echo "PATH=$PATH" >> $GITHUB_ENV

      - name: Retreive content
        uses: actions/checkout@v6
        with:
          # We hard-code 'main' because this is the production deploy
          ref: main

      - name: Deploy website
        env:
          CREATED_VIA: github deploy workflow
        run: |
          bun i

          CREATED_AT="github deploy workflow"

          NETLIFY_AUTH_TOKEN=${{ secrets.NETLIFY_AUTH_TOKEN }} NETLIFY_SITE_ID=${{secrets.NETLIFY_SITE_ID}} \
            bunx netlify deploy \
            --prod --context "Prod: main@$(git log -n1 --format="%h")" \
            --created-via "github deploy workflow" \
            --message "Deployed from repository's deploy workflow $EXTRA_CONTENT"
