name: Deploy

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-slim
    steps:
      - name: Debug
        if: inputs.payload
        run: |
          echo "::notice::Deploy triggered via PagesCMS"
          echo '${{ inputs.payload }}' | jq .
      - name: Trigger deploy hook
        run: |
          if curl -X POST -d {} ${{ secrets.NETLIFY_DEPLOY_HOOK }};
          then
            echo "::notice::Website has been deployed."
          else
            echo "::error::Failed to deploy website."
          fi
