# -------------------------------------------------
# | Merge a branch into another without touching  |
# | the "into" branch's content.                  |
# |                                               |
# | This is useful because GitHub does not        |
# | the "ours" merge strategy.                    |
# -------------------------------------------------

name: Structure merger

on:
  # When pushing to dev AND package.json's version are different
  push:
    branches:
      - dev

  workflow_dispatch:
    inputs:
      verify-version:
        default: false
        type: boolean
        required: true
        description: If you want to abort the merge if the package.json's version are the same in both branches

      from:
        default: dev
        type: string
        required: true
        description: The name of the branch to copy the structure from
      to:
        default: main
        type: string
        required: true
        description: The name of the branch to copy the structure to

env:
  FROM: ${{ inputs.from || 'dev' }}
  TO: ${{ inputs.to || 'merge-test' }}
  IGNORED_LOCATIONS: public/content src/data/content

jobs:
  ensure-mergable:
    runs-on: ubuntu-slim
    outputs:
      target_exists: ${{ steps.target.outputs.exists }}
      conflicts: ${{ steps.mergeability.outputs.conflicts }}
    steps:
      - uses: actions/checkout@v6
      - name: Ensure ${{ env.FROM }} branch exists
        run: |
          FROM_EXISTS=$(git ls-remote --heads origin '${{ env.FROM }}')
          if [ -z "$FROM_EXISTS" ]; 
          then
            echo "::error::The branch ${{env.FROM}} does not exist."
            exit 1
          fi
      - name: Check if branch ${{ env.TO }}
        id: target
        run: |
          TO_EXISTS=$(git ls-remote --heads origin '${{ env.TO }}')

          if [ -z "$TO_EXISTS" ]; 
          then
            echo "::notice::The branch ${{env.TO}} does not exist."
          else
            echo "exists=1" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v6
        if: steps.target.outputs.exists
        with:
          ref: ${{ env.TO }}
          fetch-depth: 0
      - name: Check mergability
        if: steps.target.outputs.exists
        id: mergeability
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions-mergeability-tester"

          if ! git merge --no-ff --no-commit origin/${{ env.FROM }}; 
          then
            echo "::error::Somes files are conflicting between branches ${{ env.FROM }} and ${{ env.TO }}."
            echo "conflicts=1" >> $GITHUB_OUTPUT
            exit 1
          fi

  check-version:
    runs-on: ubuntu-slim
    needs:
      - ensure-mergable
    if: |
      (inputs.verify-version == null || inputs.verify-version)
      && needs.ensure-mergable.outputs.target_exists
    outputs:
      same: ${{ steps.matcher.outputs.same }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TO }}
      - name: Fetch current version
        run: EXISTING_VERSION=$(grep "version" ./package.json | grep -oP "\d.+(?=\")")
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.FROM }}
      - name: Fetch mergin version
        run: MERGING_VERSION=$(grep "version" ./package.json | grep -oP "\d.+(?=\")")
      - name: Verify versions
        id: matcher
        run: |
          SAME=0

          if [ "$EXISTING_VERSION" = "$MERGIN_VERSION" ]; 
          then
            echo "::notice::Both versions matches. The merge will not append."
            SAME=1
          else
            echo "::notice::Versions differ. Passing from '$EXISTING_VERSION' to '$MERGING_VERSION'."
          fi

          echo "same=$SAME" >> $GITHUB_OUTPUT

  merge:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    needs:
      - check-version
      - ensure-mergable
    # Condition for the merge to appen:
    # - ensure-mergable succeed
    # - check-version succeed or skipped
    # - there is no merge conflicts
    # - Either:
    #   - target branch doesn't exist
    #   - target branch package.json's version is different from the source branch package.json's version
    if: |
      always()
      && needs.ensure-mergable.result == 'success'
      && contains('success skipped', needs.check-version.result)
      && ! needs.ensure-mergable.outputs.conflicts

      && ! (
        needs.ensure-mergable.outputs.target_exists && needs.check-version.outputs.same
      )
    env:
      TMP_BRANCH: tmp/content-restorer
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.FROM }}
          fetch-depth: 0
      - name: Switch to the ${{ env.TMP_BRANCH }} tempory branch
        run: git switch -c ${{ env.TMP_BRANCH }}

      - name: Updating the content to match ${{ env.TO }} (or deleting it if ${{ env.TO }} does not exist)
        env:
          TARGET_EXISTS: ${{ needs.ensure-mergable.outputs.target_exists }}
        run: |
          for LOC in ${IGNORED_LOCATIONS[@]}; do
            LOC="./$LOC"

            if [ "$TARGET_EXISTS" = "1"]; then
              git checkout origin ${{ env.FROM }} $LOC
              echo "::notice::Restored $LOC from ${{ env.FROM }}"
            elif [ -e $LOC ]; then
              rm -rf $LOC
              echo "::notice::Deleted $LOC"
            else
              echo "::warning::$LOC does not exist"
            fi
          done

      - name: Saving changes
        uses: EndBug/add-and-commit@v10
        with:
          message: "workflow: Excluding content files"
          pull: ""
          push: false

      - name: Merging to ${{ env.TO }}
        if: needs.ensure-mergable.outputs.target_exists == 1
        run: |
          git switch ${{ env.TO }}
          git merge ${{ env.TMP_BRANCH }}

      - name: Pushing changes to ${{ env.TO }}
        uses: ad-m/github-push-action@master
        with:
          branch: ${{ env.TO }}
